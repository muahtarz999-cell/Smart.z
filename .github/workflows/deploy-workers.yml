name: Deploy Smart.z Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'windows-agent/**'
      - 'public/**'
      - 'open-next.config.ts'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-workers.yml'

concurrency:
  group: deploy-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Sync runtime secrets to Cloudflare Worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # AI receptionist (ENV_SETUP.md): empty secrets are skipped.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WEBHOOK_SECRET: ${{ secrets.OPENAI_WEBHOOK_SECRET }}
          OPENAI_REALTIME_MODEL: ${{ secrets.OPENAI_REALTIME_MODEL }}
          OPENAI_REALTIME_VOICE: ${{ secrets.OPENAI_REALTIME_VOICE }}
          WHATSAPP_CALLS_SIP_HOST: ${{ secrets.WHATSAPP_CALLS_SIP_HOST }}
          WHATSAPP_CALLS_SIP_PORT: ${{ secrets.WHATSAPP_CALLS_SIP_PORT }}
          # Brain providers (lib/brain-providers.js): empty secrets are skipped.
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL }}
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          OPENROUTER_API_KEY_BACKUP: ${{ secrets.OPENROUTER_API_KEY_BACKUP }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          BRAIN_PROVIDER_ORDER: ${{ secrets.BRAIN_PROVIDER_ORDER }}
        run: |
          set -euo pipefail
          for name in GROQ_API_KEY GROQ_API_KEY_2 GROQ_API_KEY_3 GROQ_API_KEY_4 GROQ_API_KEY_5 OPENROUTER_API_KEY AZURE_SPEECH_KEY AZURE_SPEECH_REGION OPENAI_API_KEY OPENAI_WEBHOOK_SECRET OPENAI_REALTIME_MODEL OPENAI_REALTIME_VOICE WHATSAPP_CALLS_SIP_HOST WHATSAPP_CALLS_SIP_PORT GROQ_MODEL CEREBRAS_API_KEY CEREBRAS_API_KEY_2 CEREBRAS_API_KEY_3 CEREBRAS_MODEL OMNIROUTE_URL OMNIROUTE_API_KEY OMNIROUTE_MODEL OPENROUTER_API_KEY_BACKUP OPENROUTER_MODEL BRAIN_PROVIDER_ORDER; do
            if [ -n "${!name:-}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name" --name smart-z
            fi
          done

      - name: Build and deploy Worker
        run: npm run deploy
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
