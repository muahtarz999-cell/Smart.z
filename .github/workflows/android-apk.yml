# Builds the Android app (APK) on GitHub's servers — no Android Studio needed.
#
# When it runs: on every push that touches the app, or by hand from
#   GitHub → Actions → "Android APK" → Run workflow.
# Where the APK is: open the finished run → "Artifacts" → smartz-android-apk.
#
# Signing (important, set once): Android only installs an update over the app
# when both are signed with the same key. Without the secrets below each run
# signs with a new temporary key, so the phone refuses the update and the app
# must be uninstalled first — which deletes everything stored on the phone
# (memories, files, documents). Add these repository secrets once
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# See "بناء APK.md" for the one-line command that creates the keystore.

name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.js'
      - 'capacitor-shell/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'test/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SMARTZ_VERSION_CODE: ${{ github.run_number }}
      SMARTZ_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Run the app's tests
        run: node --test test/*.test.mjs

      - name: Sync Capacitor into the Android project
        run: npx cap sync android

      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/smartz.jks"
            echo "file=$RUNNER_TEMP/smartz.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the project key."
          else
            echo "::warning::No signing key in secrets: building a debug APK with a temporary key. The phone will not install it over a previous build; see the comment at the top of this file."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.file != ''
        working-directory: android
        env:
          SMARTZ_KEYSTORE_FILE: ${{ steps.signing.outputs.file }}
          SMARTZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMARTZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMARTZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../apk && cp app/build/outputs/apk/release/app-release.apk "../apk/smartz-${SMARTZ_VERSION_NAME}.apk"

      - name: Build debug APK
        if: steps.signing.outputs.file == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../apk && cp app/build/outputs/apk/debug/app-debug.apk "../apk/smartz-${SMARTZ_VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: smartz-android-apk
          path: apk/*.apk
          retention-days: 30
